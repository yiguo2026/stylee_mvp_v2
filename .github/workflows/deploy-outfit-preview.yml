name: Temporary outfit layout preview

on:
  push:
    branches: [codex/outfit-quality-semantic-layout]
    paths:
      - .github/workflows/deploy-outfit-preview.yml
      - .stylee-preview-action
      - scripts/preview-pages.sh
      - scripts/test-preview-pages.sh

permissions:
  contents: read

jobs:
  publish-preview:
    if: github.repository == 'yiguo2026/stylee_mvp_v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read preview action
        id: preview
        shell: bash
        run: |
          action="$(tr -d '[:space:]' < .stylee-preview-action)"
          case "$action" in
            deploy|cleanup) ;;
            *) echo "Unsupported preview action: $action"; exit 2 ;;
          esac
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Block server secrets from Expo bundles
        if: steps.preview.outputs.action == 'deploy'
        run: |
          if git grep -nE 'EXPO_PUBLIC_(DEEPSEEK|DASHSCOPE|ARK|SUPABASE_SERVICE)' -- . ':!docs/**' ':!.github/workflows/*.yml'; then
            echo 'Server credentials must never use EXPO_PUBLIC_* variables.'
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.preview.outputs.action == 'deploy'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.preview.outputs.action == 'deploy'
        run: npm ci

      - name: Validate deploy env
        if: steps.preview.outputs.action == 'deploy'
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_STYLEE_API: ${{ vars.EXPO_PUBLIC_STYLEE_API }}
        run: |
          missing=()
          for key in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_STYLEE_API; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required GitHub Actions secrets/vars: ${missing[*]}"
            exit 1
          fi

      - name: Configure preview base URL
        if: steps.preview.outputs.action == 'deploy'
        run: |
          node -e "const fs=require('fs');const p='app.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.expo.experiments={...(j.expo.experiments||{}),baseUrl:'/preview/outfit-19'};fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"

      - name: Build preview
        if: steps.preview.outputs.action == 'deploy'
        run: npm run build:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_STYLEE_API: ${{ vars.EXPO_PUBLIC_STYLEE_API }}
          EXPO_PUBLIC_QWEATHER_KEY: ${{ secrets.EXPO_PUBLIC_QWEATHER_KEY || vars.EXPO_PUBLIC_QWEATHER_KEY }}
          EXPO_PUBLIC_QWEATHER_HOST: ${{ secrets.EXPO_PUBLIC_QWEATHER_HOST || vars.EXPO_PUBLIC_QWEATHER_HOST }}

      - name: Verify preview build paths
        if: steps.preview.outputs.action == 'deploy'
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('dist/index.html','utf8');if(!h.includes('/preview/outfit-19/_expo/')){throw new Error('preview bundle path missing')}if(!fs.existsSync('dist/404.html')){throw new Error('SPA fallback missing')}"

      - name: Check out Pages without replacing production
        uses: actions/checkout@v4
        with:
          repository: yiguo2026/yiguo2026.github.io
          ref: gh-pages
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: pages

      - name: Apply isolated preview change
        run: bash scripts/preview-pages.sh "${{ steps.preview.outputs.action }}" dist pages preview/outfit-19

      - name: Commit isolated preview change
        shell: bash
        run: |
          cd pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- preview/outfit-19
          if git diff --cached --quiet; then
            echo 'No Pages preview change to publish.'
          else
            git commit -m "chore(preview): ${{ steps.preview.outputs.action }} outfit-19"
            git push origin HEAD:gh-pages
          fi
