name: Shared Core Consumer

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'vendor/**'
      - 'scripts/**'
      - 'src/lib/**'
      - 'src/stores/**'
      - 'src/app/_layout.tsx'
      - 'src/app/(auth)/login.tsx'
      - 'tsconfig.json'
      - '.github/workflows/consumer-control.yml'
      - '.github/workflows/deploy-web.yml'
      - '.github/workflows/design-system.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'vendor/**'
      - 'scripts/**'
      - 'src/lib/**'
      - 'src/stores/**'
      - 'src/app/_layout.tsx'
      - 'src/app/(auth)/login.tsx'
      - 'tsconfig.json'
      - '.github/workflows/consumer-control.yml'
      - '.github/workflows/deploy-web.yml'
      - '.github/workflows/design-system.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.1'
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: npm ci --ignore-scripts
      - run: npm run test:consumer-control
      - run: npm run check
        env:
          DESIGN_SYSTEM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm run build:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: public-anon-placeholder
          EXPO_PUBLIC_STYLEE_API: https://example.com
