name: Verify model-service mirror

on:
  pull_request:
    paths:
      - 'model-service/**'
      - 'scripts/check-model-service-sync.sh'
      - 'scripts/model-service-governed-paths.txt'
      - '.github/workflows/model-service-sync.yml'
  push:
    branches: [main]
    paths:
      - 'model-service/**'
      - 'scripts/check-model-service-sync.sh'
      - 'scripts/model-service-governed-paths.txt'
      - '.github/workflows/model-service-sync.yml'

permissions:
  contents: read

jobs:
  pr-mirror:
    name: Verify public mirror on pull requests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout App source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Read pinned canonical commit
        shell: bash
        run: |
          set -euo pipefail
          pin_file=model-service/UPSTREAM_COMMIT
          if [[ ! -f "$pin_file" || -L "$pin_file" ]]; then
            echo "UPSTREAM_COMMIT must be a regular file."
            exit 1
          fi
          if [[ "$(wc -l < "$pin_file" | tr -d '[:space:]')" != 1 ]]; then
            echo "UPSTREAM_COMMIT must contain exactly one line."
            exit 1
          fi
          sha=$(<"$pin_file")
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "UPSTREAM_COMMIT must be a 40-character lowercase Git SHA."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install mirrored model-service requirements
        shell: bash
        run: python -m pip install --requirement model-service/requirements.txt

      - name: Verify mirrored RAG manifest
        shell: bash
        run: python model-service/scripts/build_rag_manifest.py --dir model-service/data/garments2look --check

      - name: Run mirrored model-service tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in model-service/test_*.py; do
            python "$test_file"
          done

  trusted-main-mirror:
    name: Verify private canonical mirror on trusted main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'yiguo2026/stylee_mvp_v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout App source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Read pinned canonical commit
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          pin_file=model-service/UPSTREAM_COMMIT
          if [[ ! -f "$pin_file" || -L "$pin_file" ]]; then
            echo "UPSTREAM_COMMIT must be a regular file."
            exit 1
          fi
          if [[ "$(wc -l < "$pin_file" | tr -d '[:space:]')" != 1 ]]; then
            echo "UPSTREAM_COMMIT must contain exactly one line."
            exit 1
          fi
          sha=$(<"$pin_file")
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "UPSTREAM_COMMIT must be a 40-character lowercase Git SHA."
            exit 1
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned canonical source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: fitzw/style-model
          ref: ${{ steps.upstream.outputs.sha }}
          token: ${{ secrets.STYLE_MODEL_READ_TOKEN }}
          persist-credentials: false
          path: canonical-model-service

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install canonical model-service requirements
        shell: bash
        run: python -m pip install --requirement canonical-model-service/requirements.txt

      - name: Check generated mirror against canonical source
        shell: bash
        run: bash scripts/check-model-service-sync.sh canonical-model-service

      - name: Validate manifests and run canonical and mirrored tests
        shell: bash
        run: |
          set -euo pipefail
          for test_root in canonical-model-service model-service; do
            python "$test_root/scripts/build_rag_manifest.py" --dir "$test_root/data/garments2look" --check
            for test_file in "$test_root"/test_*.py; do
              python "$test_file"
            done
          done
