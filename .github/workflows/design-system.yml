name: Design System Guard

on:
  pull_request:
    paths:
      - "design-tokens/**"
      - "scripts/generate-design-tokens.mjs"
      - "scripts/check-design-system.mjs"
      - "scripts/check-wardrobe-density.mjs"
      - "scripts/check-outfit-fixture-alpha.py"
      - "src/data/outfitCanvasImageMetrics.generated.ts"
      - "src/data/outfitLayoutDemoFixtures.ts"
      - "src/types/index.ts"
      - "src/stores/wardrobeStore.ts"
      - "src/lib/outfitImageMetrics.ts"
      - "src/lib/outfitImageMetrics.test.ts"
      - "src/lib/standardizationPolicy.ts"
      - "src/lib/standardizationPolicy.test.ts"
      - "src/lib/garmentImageReplacement.ts"
      - "src/lib/garmentImageReplacement.test.ts"
      - "src/lib/outfitCanvasLayout.ts"
      - "src/lib/outfitCanvasLayout.test.ts"
      - "src/lib/outfitCanvasImageState.ts"
      - "src/lib/outfitCanvasImageState.test.ts"
      - "src/lib/outfitResultRole.test.ts"
      - "src/lib/outfitLayoutDemoRoute.test.ts"
      - "src/lib/styleeMapping.ts"
      - "src/lib/styleeMapping.test.ts"
      - "src/hooks/useGarmentImageReplace.ts"
      - "src/design-system/StyleeOutfitCanvas.tsx"
      - "src/design-system/outfitCanvasComponent.test.ts"
      - "src/app/outfit/result.tsx"
      - "src/app/outfit-layout-demo.tsx"
      - "public/preset-items/**"
      - "src/design-system/**"
      - "src/app/**"
      - "src/components/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/design-system.yml"
  push:
    branches: [main, tokens-sync]
    paths:
      - "design-tokens/**"
      - "scripts/generate-design-tokens.mjs"
      - "scripts/check-design-system.mjs"
      - "scripts/check-wardrobe-density.mjs"
      - "scripts/check-outfit-fixture-alpha.py"
      - "src/data/outfitCanvasImageMetrics.generated.ts"
      - "src/data/outfitLayoutDemoFixtures.ts"
      - "src/types/index.ts"
      - "src/stores/wardrobeStore.ts"
      - "src/lib/outfitImageMetrics.ts"
      - "src/lib/outfitImageMetrics.test.ts"
      - "src/lib/standardizationPolicy.ts"
      - "src/lib/standardizationPolicy.test.ts"
      - "src/lib/garmentImageReplacement.ts"
      - "src/lib/garmentImageReplacement.test.ts"
      - "src/lib/outfitCanvasLayout.ts"
      - "src/lib/outfitCanvasLayout.test.ts"
      - "src/lib/outfitCanvasImageState.ts"
      - "src/lib/outfitCanvasImageState.test.ts"
      - "src/lib/outfitResultRole.test.ts"
      - "src/lib/outfitLayoutDemoRoute.test.ts"
      - "src/lib/styleeMapping.ts"
      - "src/lib/styleeMapping.test.ts"
      - "src/hooks/useGarmentImageReplace.ts"
      - "src/design-system/StyleeOutfitCanvas.tsx"
      - "src/design-system/outfitCanvasComponent.test.ts"
      - "src/app/outfit/result.tsx"
      - "src/app/outfit-layout-demo.tsx"
      - "public/preset-items/**"
      - "src/design-system/**"
      - "src/app/**"
      - "src/components/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/design-system.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --global npm@11.12.1
      - run: npm ci

      - name: Verify outfit canvas regressions
        run: |
          node --experimental-strip-types --test \
            src/lib/garmentImageReplacement.test.ts \
            src/lib/outfitImageMetrics.test.ts \
            src/lib/standardizationPolicy.test.ts \
            src/lib/outfitCanvasLayout.test.ts \
            src/lib/outfitCanvasImageState.test.ts \
            src/design-system/outfitCanvasComponent.test.ts \
            src/lib/outfitResultRole.test.ts \
            src/lib/outfitLayoutDemoRoute.test.ts \
            src/lib/styleeMapping.test.ts

      - name: Verify public demo Auth boundary
        run: >-
          node --import ./src/lib/test-fixtures/rootRoute/register.mjs --test
          --test-name-pattern='public preview /outfit-layout-demo'
          src/lib/rootRoute.integration.test.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image metric dependency
        run: python -m pip install -r model-service/requirements.txt

      - name: Verify outfit image metrics
        run: npm run outfit-metrics:check

      - name: Verify generated tokens
        run: npm run tokens:check

      - name: Enforce Design System usage
        run: npm run design-system:check
        env:
          DESIGN_SYSTEM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Verify wardrobe density contract
        run: npm run wardrobe-density:check

      - name: Type check
        run: npx tsc --noEmit

      - name: Build web
        run: npm run build:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: public-anon-placeholder
          EXPO_PUBLIC_STYLEE_API: https://example.com
